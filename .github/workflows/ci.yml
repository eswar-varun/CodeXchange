name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # the harness relies on Node's stable --permission flag
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Validate evaluation tasks against reference solutions
        run: |
          python -m evals.run_eval --reference --direction python-javascript
          python -m evals.run_eval --reference --direction javascript-python
